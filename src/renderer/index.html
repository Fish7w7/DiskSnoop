<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskSnoop</title>
    <script>
      const bootLanguage = new URLSearchParams(location.search).get("bootLanguage");
      document.documentElement.lang = bootLanguage === "pt-BR" ? "pt-BR" : "en-US";
      try {
        const bootTheme = new URLSearchParams(location.search).get("bootTheme");
        const savedTheme = localStorage.getItem("disksnoop-theme");
        const legacyThemes = { hacker: "graphite", neon: "graphite" };
        const supportedThemes = ["light", "dark", "paper", "graphite", "system"];
        const normalizeTheme = (value) => {
          const theme = String(value || "").toLowerCase();
          if (supportedThemes.includes(theme)) return theme;
          return legacyThemes[theme] || "dark";
        };
        const normalizedSavedTheme = normalizeTheme(savedTheme);
        document.documentElement.dataset.theme = savedTheme
          ? normalizedSavedTheme
          : bootTheme
            ? normalizeTheme(bootTheme)
            : normalizedSavedTheme;
        if (savedTheme && savedTheme !== normalizedSavedTheme) {
          localStorage.setItem("disksnoop-theme", normalizedSavedTheme);
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./i18n.js"></script>
  </head>
  <body>
    <div id="app">
      <main class="boot-screen">
        <div class="boot-bg-grid"></div>
        <div class="boot-glow"></div>
        <section class="boot-card">
          <div class="boot-icon-ring">
            <div class="boot-icon-wrap">
              <img src="../assets/app-icon.png" alt="" />
            </div>
          </div>
          <h1>DiskSnoop</h1>
          <p class="boot-status" data-boot-status aria-live="polite"></p>
          <div class="boot-loader">
            <span data-boot-progress></span>
          </div>
          <div class="boot-meta">
            <span class="boot-dot"></span>
            <span class="boot-version">v1.13.0</span>
          </div>
        </section>
      </main>
      <script>
        (() => {
          const steps = { loading: "boot.loadingApp", ready: "boot.openingApp" };
          const status = document.querySelector("[data-boot-status]");
          let current = "loading";

          const applyStep = () => {
            status.textContent = window.diskSnoopI18n.translate(document.documentElement.lang, steps[current]);
          };

          window.diskSnoopBoot = {
            setStep(step) {
              current = step;
              applyStep();
            }
          };

          applyStep();
        })();
      </script>
    </div>
    <script src="./local-changelog.js"></script>
    <script src="./color-utils.js"></script>
    <script src="./overview-comparison.js"></script>
    <script src="./large-folder-tree.js"></script>
    <script src="./content-browser.js"></script>
    <script src="./candidate-ai-analysis.js"></script>
    <script src="./candidate-batch-actions.js"></script>
    <script src="./custom-select.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
