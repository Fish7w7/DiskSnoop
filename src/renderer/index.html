<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskSnoop</title>
    <script>
      try {
        const bootTheme = new URLSearchParams(location.search).get("bootTheme");
        const savedTheme = localStorage.getItem("disksnoop-theme");
        const legacyThemes = { hacker: "graphite", neon: "graphite" };
        const supportedThemes = ["light", "dark", "paper", "graphite", "system"];
        const normalizeTheme = (value) => {
          const theme = String(value || "").toLowerCase();
          if (supportedThemes.includes(theme)) return theme;
          return legacyThemes[theme] || "dark";
        };
        const normalizedSavedTheme = normalizeTheme(savedTheme);
        document.documentElement.dataset.theme = bootTheme
          ? normalizeTheme(bootTheme)
          : normalizedSavedTheme;
        if (savedTheme && savedTheme !== normalizedSavedTheme) {
          localStorage.setItem("disksnoop-theme", normalizedSavedTheme);
        }
        const language = localStorage.getItem("disksnoop-language");
        if (language) document.documentElement.lang = language;
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <main class="boot-screen">
        <div class="boot-bg-grid"></div>
        <div class="boot-glow"></div>
        <section class="boot-card">
          <div class="boot-icon-ring">
            <div class="boot-icon-wrap">
              <img src="../assets/app-icon.png" alt="" />
            </div>
          </div>
          <h1>DiskSnoop</h1>
          <p class="boot-status" data-boot-status aria-live="polite">Carregando configurações...</p>
          <div class="boot-loader">
            <span data-boot-progress></span>
          </div>
          <div class="boot-meta">
            <span class="boot-dot"></span>
            <span class="boot-version">v1.8.0-beta.1</span>
          </div>
        </section>
      </main>
      <script>
        (() => {
          const steps = [
            { key: "loading", text: { "pt-BR": "Preparando DiskSnoop...", "en-US": "Preparing DiskSnoop..." } },
            { key: "ready", text: { "pt-BR": "Abrindo app...", "en-US": "Opening app..." } }
          ];
          const status = document.querySelector("[data-boot-status]");
          let language = "pt-BR";
          let current = 0;
          try {
            const saved = localStorage.getItem("disksnoop-language");
            if (saved === "en-US") language = saved;
          } catch {}

          const applyStep = (index) => {
            current = Math.max(0, Math.min(steps.length - 1, index));
            const step = steps[current];
            if (status) status.textContent = step.text[language] || step.text["pt-BR"];
          };

          window.diskSnoopBoot = {
            setLanguage(nextLanguage) {
              if (nextLanguage === "en-US" || nextLanguage === "pt-BR") {
                language = nextLanguage;
                document.documentElement.lang = language;
                applyStep(current);
              }
            },
            setStep(stepKey) {
              const index = typeof stepKey === "number"
                ? stepKey
                : steps.findIndex((step) => step.key === stepKey);
              if (index >= 0) applyStep(index);
            }
          };

          applyStep(0);
        })();
      </script>
    </div>
    <script src="./i18n.js"></script>
    <script src="./local-changelog.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
